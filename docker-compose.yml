version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forksquare_postgres
    restart: always
    environment:
      POSTGRES_USER: forksquare
      POSTGRES_PASSWORD: forksquare_secret
      POSTGRES_DB: forksquare_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: forksquare_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: forksquare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: forksquare_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # NEW: ClickHouse (Columnar DB for Analytics)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: forksquare_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # NEW: Neo4j (Graph DB for Visualization)
  neo4j:
    image: neo4j:5-community
    container_name: forksquare_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/forksquare_neo4j_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redpanda_data:
  clickhouse_data:
  neo4j_data: