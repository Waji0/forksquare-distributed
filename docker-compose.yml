version: '3.8'

services:
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: forksquare_postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: forksquare
  #     POSTGRES_PASSWORD: forksquare_secret
  #     POSTGRES_DB: forksquare_orders
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data



  # ============================================
  # PRIMARY (handles all WRITES)
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forksquare_postgres
    restart: always
    environment:
      POSTGRES_USER: forksquare
      POSTGRES_PASSWORD: forksquare_secret
      POSTGRES_DB: forksquare_orders
    command:
      - postgres
      - -c
      - wal_level=replica          # Required for streaming replication
      - -c
      - max_wal_senders=10         # Max concurrent WAL sender processes
      - -c
      - max_replication_slots=10   # Max replication slots
      - -c
      - hot_standby=on             # Allow reads on standby
      - -c
      - wal_log_hints=on           # Enables pg_rewind for failover
      - -c 
      - max_prepared_transactions=50
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/primary:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forksquare -d forksquare_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # STANDBY (handles READS, streams WAL from primary)
  # ============================================
  postgres-standby:
    image: pgvector/pgvector:pg16
    container_name: forksquare_postgres_standby
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
      REPLICATOR_USER: replicator
      REPLICATOR_PASSWORD: replicator_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./docker/postgres/standby:/standby-setup
    entrypoint: ["sh", "/standby-setup/setup_standby.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forksquare -d forksquare_orders"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: forksquare_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: forksquare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    # ============================================
  # RAFT CONSENSUS CLUSTER (etcd) - Week 12
  # ============================================
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forksquare_etcd_1
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-1:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-1:2379
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=forksquare-raft-cluster
    ports:
      - "2379:2379"

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forksquare_etcd_2
    environment:
      - ETCD_NAME=etcd-2
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-2:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-2:2379
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=forksquare-raft-cluster
    ports:
      - "2389:2379"

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forksquare_etcd_3
    environment:
      - ETCD_NAME=etcd-3
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-3:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-3:2379
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=forksquare-raft-cluster
    ports:
      - "2399:2379"

  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: forksquare_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # NEW: ClickHouse (Columnar DB for Analytics)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: forksquare_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # NEW: Neo4j (Graph DB for Visualization)
  neo4j:
    image: neo4j:5-community
    container_name: forksquare_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/forksquare_neo4j_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  postgres_standby_data:
  mongo_data:
  redis_data:
  redpanda_data:
  clickhouse_data:
  neo4j_data: