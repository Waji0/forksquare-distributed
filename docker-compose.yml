version: '3.8'

services:
  # UPDATED: Use pgvector image for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forksquare_postgres
    restart: always
    environment:
      POSTGRES_USER: forksquare
      POSTGRES_PASSWORD: forksquare_secret
      POSTGRES_DB: forksquare_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: forksquare_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: forksquare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: forksquare_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redpanda_data: